[package]
name = "cargo-furiosa-opt"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/furiosa-ai/furiosa-opt"
description = "TCP Virtual ISA compiler for Furiosa NPU"

[[bin]]
name = "cargo-furiosa-opt"
path = "src/main.rs"

[[bin]]
name = "furiosa-opt-driver"
path = "src/driver.rs"

# pkg-url and bin-dir must resolve to the asset name produced by
# `scripts/furiosa-opt-release.sh`; that script verifies the match before packaging.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cargo-furiosa-opt-v{ version }-{ target }{ archive-suffix }"
bin-dir = "cargo-furiosa-opt-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]
