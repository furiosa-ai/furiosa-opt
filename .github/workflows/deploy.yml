name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - snapshot
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_mdbook:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Install mdbook-mermaid
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook-mermaid

      # `make mdbook-build` runs lychee over the rendered HTML.
      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Build Book
        run: |
          mdbook-mermaid install docs
          make mdbook-build

      - name: Upload Book Artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: docs/book
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build_mdbook]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/snapshot'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Book Artifact
        uses: actions/download-artifact@v4
        with:
          name: book
          path: deploy/book

      # Rustdoc is not self-hosted; docs.rs is its canonical home. Keep only
      # a redirect at the old rustdoc/ location.
      - name: Render Rustdoc Redirect
        run: |
          mkdir -p deploy/rustdoc
          url=https://docs.rs/furiosa-opt-std
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="%s"><a href="%s">%s</a>\n' \
            "$url" "$url" "$url" "$url" > deploy/rustdoc/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
