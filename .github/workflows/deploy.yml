name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - snapshot
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FURIOSA_OPT_GITHUB_REPO: ${{ github.repository }}

jobs:
  build_mdbook:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Install mdbook-mermaid
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook-mermaid

      - name: Build Book
        run: |
          mdbook-mermaid install docs
          make mdbook-build

      - name: Upload Book Artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: docs/book
          retention-days: 1

  build_rustdoc:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-01

      - name: Download Released Libraries
        id: download
        uses: ./.github/actions/download-released-libraries

      - name: Set Prebuilt Library Paths
        shell: bash
        run: |
          TARGET=x86_64-unknown-linux-gnu
          VERSION=${{ steps.download.outputs.version }}
          PREBUILT_DIR=${{ steps.download.outputs.prebuilt_dir }}
          echo "FURIOSA_MAPPING_IMPL_LOCAL_PREBUILT=${PREBUILT_DIR}/libfuriosa_mapping_impl-${VERSION}-${TARGET}.a" >> $GITHUB_ENV
          echo "FURIOSA_OPT_LOWER_IMPL_LOCAL_PREBUILT=${PREBUILT_DIR}/libfuriosa_opt_lower_impl-${VERSION}-${TARGET}.a" >> $GITHUB_ENV

      - name: Generate Documentation
        run: |
          cargo doc --no-deps --workspace --target-dir target-rustdoc

      - name: Upload Rustdoc Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: target-rustdoc/doc
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build_mdbook, build_rustdoc]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/snapshot'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Docs Artifacts
        uses: actions/download-artifact@v4
        with:
          path: deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
